<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kas Masjid Al-Falah</title>
  <!-- Tailwind CSS CDN untuk tampilan modern -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background-color: #fff !important; padding: 0 !important; font-size: 11pt; }
      .print-area { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
      table { border-collapse: collapse !important; width: 100% !important; }
      th, td { border: 1px solid #555 !important; }
      .bg-yellow-header { background-color: #fef08a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bg-green-highlight { background-color: #86efac !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    .bg-yellow-header { background-color: #fef08a; }
    .bg-green-highlight { background-color: #bbf7d0; }
  </style>
</head>
<body class="bg-slate-100 text-gray-800 min-h-screen p-3 md:p-6 font-sans">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- ========================================== -->
    <!-- 1. MENU INPUT DATA (DISEMBUNYIKAN SAAT CETAK) -->
    <!-- ========================================== -->
    <div class="no-print bg-white rounded-xl shadow p-5 border border-slate-200">
      <div class="flex items-center justify-between border-b pb-3 mb-4">
        <div>
          <h2 id="formTitle" class="text-lg font-bold text-emerald-800">📥 Menu Input Transaksi Kas</h2>
          <p class="text-xs text-gray-500">Masukkan transaksi kas masuk atau kas keluar masjid.</p>
        </div>
        <div class="flex gap-2">
          <button onclick="resetDataLampiran()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg border">
            🔄 Isi Data Contoh Lampiran
          </button>
        </div>
      </div>

      <form id="formTransaksi" onsubmit="handleSimpan(event)" class="space-y-4">
        <input type="hidden" id="editId" value="-1">

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Hari</label>
            <input type="text" id="inpHari" placeholder="Contoh: Jum'at / Ahad" class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal</label>
            <input type="text" id="inpTgl" required placeholder="Contoh: 04/09/'26" class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Petugas / Pemegang Kas</label>
            <select id="inpPic" class="w-full text-sm border rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none font-medium">
              <option value="P.WITO">P. Wito</option>
              <option value="P.ZAKI">P. Zaki</option>
              <option value="UMAM">Umam (Bendahara)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Jenis Transaksi</label>
            <select id="inpJenis" onchange="toggleJenisNominal()" class="w-full text-sm border rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none font-medium">
              <option value="MASUK">Uang Kas Masuk (+)</option>
              <option value="KELUAR">Uang Kas Keluar (-)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Keterangan Transaksi</label>
            <input type="text" id="inpKet" required placeholder="Contoh: Infaq jariyah jamaah jum'at / Transport ustadz" class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Nominal (Rp)</label>
            <input type="number" id="inpNominal" min="0" required placeholder="0" class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-bold text-gray-800">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t">
          <button type="button" id="btnBatal" onclick="batalEdit()" class="hidden px-4 py-2 text-xs font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg">
            Batal
          </button>
          <button type="submit" id="btnSubmit" class="px-5 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg shadow-sm">
            💾 Simpan Transaksi
          </button>
        </div>
      </form>
    </div>

    <!-- ========================================== -->
    <!-- 2. PILIHAN TAMPILAN LAPORAN & CETAK        -->
    <!-- ========================================== -->
    <div class="no-print bg-white rounded-xl shadow p-4 border border-slate-200 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-gray-700">Tampilan Laporan:</span>
        <button onclick="setTampilan('MODEL1')" id="btnTabModel1" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-700 text-white">
          Model 1: Per Petugas (P. Wito, Zaki, Umam)
        </button>
        <button onclick="setTampilan('MODEL2')" id="btnTabModel2" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300">
          Model 2: Kas Gabungan (Urut Tanggal)
        </button>
      </div>

      <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-5 py-2 rounded-lg flex items-center gap-2 shadow">
        🖨️ Cetak / Print Laporan (PDF)
      </button>
    </div>

    <!-- ========================================== -->
    <!-- 3. HASIL LAPORAN (AREA YANG AKAN DICETAK)  -->
    <!-- ========================================== -->
    <div class="print-area bg-white rounded-xl shadow p-6 md:p-8 border border-slate-200">
      
      <!-- KOP / HEADER LAPORAN -->
      <div class="text-center mb-6">
        <h1 class="text-xl md:text-2xl font-black uppercase text-gray-900 tracking-wide">UANG KAS MASJID AL-FALAH</h1>
        <h2 class="text-md md:text-lg font-bold text-gray-800">Ranting Muhammadiyah Pasir Kidul</h2>
        <h3 class="text-sm font-bold mt-1 text-gray-700 uppercase">BULAN : SEPTEMBER 2026</h3>
      </div>

      <!-- KONTEN LAPORAN DINAMIS -->
      <div id="kontenLaporan"></div>

      <!-- TANDA TANGAN (HANYA MUNCUL DI PRINT) -->
      <div class="hidden print:grid grid-cols-2 text-center mt-12 text-sm">
        <div>
          <p>Mengetahui,</p>
          <p class="font-bold mt-20">Ketua Takmir Masjid Al-Falah</p>
        </div>
        <div>
          <p>Pasir Kidul, 30 September 2026</p>
          <p class="font-bold mt-20">Bendahara</p>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Saldo awal bulan sesuai catatan lampiran
    const SALDO_AWAL = {
      "P.WITO": 714000,
      "P.ZAKI": 1981500,
      "UMAM": 7070000
    };
    const SALDO_BANK_DETAIL = [
      { nama: "Buku BPD", saldo: 347866 },
      { nama: "Buku BRI", saldo: 428000 },
      { nama: "Buku BMI", saldo: 3065000 },
    ];
    const TOTAL_BANK = 3840866;

    // Data awal persis dari lampiran foto
    const dataAwal = [
      // Kas P. Wito
      { id: 1, hari: "Rabu", tgl: "02/09/'26", ket: "Infaq jariyah parkir (P.Darsono)", pic: "P.WITO", masuk: 100000, keluar: 0 },
      { id: 2, hari: "", tgl: "", ket: "Transport ustadz Takhsin", pic: "P.WITO", masuk: 0, keluar: 400000 },
      { id: 3, hari: "Ahad", tgl: "06/09/'26", ket: "Infaq jariyah jamaah ahad pagi", pic: "P.WITO", masuk: 235000, keluar: 0 },
      { id: 4, hari: "", tgl: "", ket: "Transport ustadz", pic: "P.WITO", masuk: 0, keluar: 250000 },
      { id: 5, hari: "Selasa", tgl: "08/09/'26", ket: "Infaq jariyah Parkir (P.Dahlan)", pic: "P.WITO", masuk: 50000, keluar: 0 },
      { id: 6, hari: "Jumat", tgl: "11/09/'26", ket: "Snack Jum'at bersih", pic: "P.WITO", masuk: 0, keluar: 125000 },
      { id: 7, hari: "Sabtu", tgl: "12/09/'26", ket: "Tamb. masak utk ahad pagi rt 02", pic: "P.WITO", masuk: 0, keluar: 100000 },
      { id: 8, hari: "Ahad", tgl: "13/09/'26", ket: "Infaq jariyah jamaah ahad pagi", pic: "P.WITO", masuk: 250000, keluar: 0 },
      { id: 9, hari: "", tgl: "", ket: "Transport ustadz (Sdn)", pic: "P.WITO", masuk: 0, keluar: 250000 },
      { id: 10, hari: "Rabu", tgl: "16/09/'26", ket: "Transport Ustadz Takhsin", pic: "P.WITO", masuk: 0, keluar: 200000 },
      { id: 11, hari: "Jum'at", tgl: "18/09/'26", ket: "Infaq jariyah jamaah jum'at", pic: "P.WITO", masuk: 450000, keluar: 0 },
      { id: 12, hari: "", tgl: "", ket: "Snack Jum'at bersih", pic: "P.WITO", masuk: 0, keluar: 125000 },
      { id: 13, hari: "Ahad", tgl: "20/09/'26", ket: "Infaq jariyah jamaah ahad pagi", pic: "P.WITO", masuk: 260000, keluar: 0 },
      { id: 14, hari: "", tgl: "", ket: "Transport Ustadz (Amr)", pic: "P.WITO", masuk: 0, keluar: 200000 },
      { id: 15, hari: "Jum'at", tgl: "25/09/'26", ket: "Snack Jum'at bersih", pic: "P.WITO", masuk: 0, keluar: 125000 },
      { id: 16, hari: "Ahad", tgl: "27/09/'26", ket: "Infaq jariyah jamaah ahad pagi", pic: "P.WITO", masuk: 175000, keluar: 0 },
      { id: 17, hari: "", tgl: "", ket: "Transport ustadz (Arf)", pic: "P.WITO", masuk: 0, keluar: 200000 },
      { id: 18, hari: "Rabu", tgl: "30/09/'26", ket: "Transport ustadz Takhsin", pic: "P.WITO", masuk: 0, keluar: 200000 },

      // Kas P. Zaki
      { id: 19, hari: "Jum'at", tgl: "04/09/'26", ket: "Infaq jariyah jamaah jum'at", pic: "P.ZAKI", masuk: 550000, keluar: 0 },
      { id: 20, hari: "", tgl: "Sept'26", ket: "Beli Kopi,susu + Gula", pic: "P.ZAKI", masuk: 0, keluar: 250000 },
      { id: 21, hari: "", tgl: "", ket: "Alat kebersihan", pic: "P.ZAKI", masuk: 0, keluar: 200000 },

      // Kas Umam (Bendahara)
      { id: 22, hari: "Rabu", tgl: "07/09/'26", ket: "Biaya PDAM", pic: "UMAM", masuk: 0, keluar: 205000 },
      { id: 23, hari: "Kamis", tgl: "09/09/'26", ket: "Biaya Listrik (440,47 - 642,53)", pic: "UMAM", masuk: 0, keluar: 203000 },
      { id: 24, hari: "Jum'at", tgl: "11/09/'26", ket: "Infaq jariyah jamaah jum'at", pic: "UMAM", masuk: 440000, keluar: 0 },
      { id: 25, hari: "Kamis", tgl: "24/09/'26", ket: "Infaq jariyah SMK MUTU", pic: "UMAM", masuk: 1250000, keluar: 0 },
      { id: 26, hari: "Jum'at", tgl: "25/09/'26", ket: "Infaq jariyah jamaah jum'at", pic: "UMAM", masuk: 450000, keluar: 0 },
      { id: 27, hari: "Ahad", tgl: "27/09/'26", ket: "Sosial jamaah masjid (bu.Khsn)", pic: "UMAM", masuk: 0, keluar: 250000 },
      { id: 28, hari: "Senin", tgl: "28/09/'26", ket: "Transport Ustadz Tarjih 2X", pic: "UMAM", masuk: 0, keluar: 400000 },
      { id: 29, hari: "", tgl: "", ket: "Kebersihan lingkungan masjid (Crm)", pic: "UMAM", masuk: 0, keluar: 250000 }
    ];

    let transaksiList = JSON.parse(localStorage.getItem('kas_alfalah_transaksi')) || dataAwal;
    let tampilanAktif = 'MODEL1'; // 'MODEL1' (per petugas) atau 'MODEL2' (gabungan)

    function simpanKeStorage() {
      localStorage.setItem('kas_alfalah_transaksi', JSON.stringify(transaksiList));
    }

    function formatRp(val) {
      if (!val || val === 0) return '';
      return new Intl.NumberFormat('id-ID').format(val);
    }

    function setTampilan(model) {
      tampilanAktif = model;
      const b1 = document.getElementById('btnTabModel1');
      const b2 = document.getElementById('btnTabModel2');
      if (model === 'MODEL1') {
        b1.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-700 text-white";
        b2.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300";
      } else {
        b2.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-700 text-white";
        b1.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300";
      }
      renderLaporan();
    }

    // ==========================================
    // RENDER LAPORAN
    // ==========================================
    function renderLaporan() {
      const container = document.getElementById('kontenLaporan');
      container.innerHTML = '';

      if (tampilanAktif === 'MODEL1') {
        renderModelPerPetugas(container);
      } else {
        renderModelGabungan(container);
      }
    }

    // MODEL 1: TABEL TERPISAH PER PETUGAS (SESUAI LAMPIRAN 1)
    function renderModelPerPetugas(container) {
      const sections = [
        { pic: "P.WITO", labelPic: "P.WITO", saldoAwal: SALDO_AWAL["P.WITO"] },
        { pic: "P.ZAKI", labelPic: "P.ZAKI", saldoAwal: SALDO_AWAL["P.ZAKI"] },
        { pic: "UMAM", labelPic: "UMAM", saldoAwal: SALDO_AWAL["UMAM"] }
      ];

      let saldoAkhirPetugas = {};

      sections.forEach(sec => {
        const itemTrx = transaksiList.filter(t => t.pic === sec.pic);
        let sisa = sec.saldoAwal;
        let totMsk = 0;
        let totKlr = 0;

        let rowsHtml = `
          <tr class="bg-gray-50/50">
            <td class="p-1.5 border border-gray-400"></td>
            <td class="p-1.5 border border-gray-400"></td>
            <td class="p-1.5 border border-gray-400 font-bold text-center">Uang Akhir Agustus '26</td>
            <td class="p-1.5 border border-gray-400 text-right"></td>
            <td class="p-1.5 border border-gray-400 text-right"></td>
            <td class="p-1.5 border border-gray-400 text-right font-bold">${formatRp(sisa)}</td>
            <td class="p-1.5 border border-gray-400 no-print"></td>
          </tr>
        `;

        itemTrx.forEach(t => {
          sisa = sisa + t.masuk - t.keluar;
          totMsk += t.masuk;
          totKlr += t.keluar;

          rowsHtml += `
            <tr class="hover:bg-amber-50/40">
              <td class="p-1.5 border border-gray-400 text-center">${t.hari || ''}</td>
              <td class="p-1.5 border border-gray-400 text-center">${t.tgl || ''}</td>
              <td class="p-1.5 border border-gray-400">${t.ket}</td>
              <td class="p-1.5 border border-gray-400 text-right">${formatRp(t.masuk)}</td>
              <td class="p-1.5 border border-gray-400 text-right">${formatRp(t.keluar)}</td>
              <td class="p-1.5 border border-gray-400 text-right font-semibold">${formatRp(sisa)}</td>
              <td class="p-1.5 border border-gray-400 text-center no-print whitespace-nowrap">
                <button onclick="editData(${t.id})" class="text-blue-600 hover:underline text-xs mr-2 font-bold">Edit</button>
                <button onclick="hapusData(${t.id})" class="text-red-600 hover:underline text-xs font-bold">Hapus</button>
              </td>
            </tr>
          `;
        });

        saldoAkhirPetugas[sec.pic] = sisa;

        const tableSec = document.createElement('div');
        tableSec.className = "mb-6";
        tableSec.innerHTML = `
          <div class="flex justify-between items-center bg-gray-100 px-3 py-1 border border-b-0 border-gray-400 text-xs font-bold">
            <span>BULAN : September 2026</span>
            <span class="bg-yellow-header px-4 py-0.5 border border-gray-400 uppercase">${sec.labelPic}</span>
          </div>
          <table class="w-full text-xs text-left border-collapse border border-gray-400">
            <thead class="bg-yellow-header font-bold text-center border-b border-gray-400">
              <tr>
                <th class="p-1.5 border border-gray-400 w-16">HARI</th>
                <th class="p-1.5 border border-gray-400 w-24">TGL</th>
                <th class="p-1.5 border border-gray-400">KETERANGAN</th>
                <th class="p-1.5 border border-gray-400 w-28 text-right">MASUK</th>
                <th class="p-1.5 border border-gray-400 w-28 text-right">KELUAR</th>
                <th class="p-1.5 border border-gray-400 w-32 text-right">SISA</th>
                <th class="p-1.5 border border-gray-400 w-20 text-center no-print">AKSI</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
            <tfoot class="bg-white font-bold border-t-2 border-gray-400">
              <tr>
                <td colspan="3" class="p-1.5 border border-gray-400 text-center uppercase">Jumlah Akhir September 2026</td>
                <td class="p-1.5 border border-gray-400 text-right">${formatRp(totMsk)}</td>
                <td class="p-1.5 border border-gray-400 text-right">${formatRp(totKlr)}</td>
                <td class="p-1.5 border border-gray-400 text-right font-black">${formatRp(sisa)}</td>
                <td class="p-1.5 border border-gray-400 no-print"></td>
              </tr>
            </tfoot>
          </table>
        `;
        container.appendChild(tableSec);
      });

      // Kotak Rekap Bank & Saya Sesuai Lampiran 1
      const rekapBankEl = document.createElement('div');
      rekapBankEl.className = "w-full sm:w-80 mt-6 text-xs";
      rekapBankEl.innerHTML = `
        <table class="w-full border-collapse border border-gray-400">
          <thead>
            <tr>
              <th colspan="2" class="p-1.5 border border-gray-400 bg-gray-100 text-left font-bold">Ket</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="p-1.5 border border-gray-400">Buku BPD</td>
              <td class="p-1.5 border border-gray-400 text-right font-medium">347.866</td>
            </tr>
            <tr>
              <td class="p-1.5 border border-gray-400">Buku BRI</td>
              <td class="p-1.5 border border-gray-400 text-right font-medium">428.000</td>
            </tr>
            <tr>
              <td class="p-1.5 border border-gray-400">Buku BMI</td>
              <td class="p-1.5 border border-gray-400 text-right font-medium">3.065.000</td>
            </tr>
            <tr class="bg-green-highlight font-bold">
              <td class="p-1.5 border border-gray-400">Di BANK</td>
              <td class="p-1.5 border border-gray-400 text-right">${formatRp(TOTAL_BANK)}</td>
            </tr>
            <tr class="font-bold">
              <td class="p-1.5 border border-gray-400">Di Saya (Umam)</td>
              <td class="p-1.5 border border-gray-400 text-right">${formatRp(saldoAkhirPetugas["UMAM"])}</td>
            </tr>
          </tbody>
        </table>
      `;
      container.appendChild(rekapBankEl);
    }

    // MODEL 2: TABEL GABUNGAN BESAR (SESUAI LAMPIRAN 2)
    function renderModelGabungan(container) {
      const totalSaldoAwal = SALDO_AWAL["P.WITO"] + SALDO_AWAL["P.ZAKI"] + SALDO_AWAL["UMAM"];
      let sisa = totalSaldoAwal;
      let totMsk = 0;
      let totKlr = 0;

      let saldoPerPic = {
        "P.WITO": SALDO_AWAL["P.WITO"],
        "P.ZAKI": SALDO_AWAL["P.ZAKI"],
        "UMAM": SALDO_AWAL["UMAM"]
      };

      let rowsHtml = `
        <tr class="bg-gray-50/50">
          <td class="p-1.5 border border-gray-400"></td>
          <td class="p-1.5 border border-gray-400"></td>
          <td class="p-1.5 border border-gray-400 font-bold">Sisa Kas Akhir Agustus '26</td>
          <td class="p-1.5 border border-gray-400 text-right"></td>
          <td class="p-1.5 border border-gray-400 text-right"></td>
          <td class="p-1.5 border border-gray-400 text-right font-bold">${formatRp(sisa)}</td>
          <td class="p-1.5 border border-gray-400 no-print"></td>
        </tr>
      `;

      transaksiList.forEach(t => {
        sisa = sisa + t.masuk - t.keluar;
        totMsk += t.masuk;
        totKlr += t.keluar;
        saldoPerPic[t.pic] += (t.masuk - t.keluar);

        rowsHtml += `
          <tr class="hover:bg-amber-50/40">
            <td class="p-1.5 border border-gray-400 text-center">${t.hari || ''}</td>
            <td class="p-1.5 border border-gray-400 text-center">${t.tgl || ''}</td>
            <td class="p-1.5 border border-gray-400">${t.ket}</td>
            <td class="p-1.5 border border-gray-400 text-right">${formatRp(t.masuk)}</td>
            <td class="p-1.5 border border-gray-400 text-right">${formatRp(t.keluar)}</td>
            <td class="p-1.5 border border-gray-400 text-right font-semibold">${formatRp(sisa)}</td>
            <td class="p-1.5 border border-gray-400 text-center no-print whitespace-nowrap">
              <button onclick="editData(${t.id})" class="text-blue-600 hover:underline text-xs mr-2 font-bold">Edit</button>
              <button onclick="hapusData(${t.id})" class="text-red-600 hover:underline text-xs font-bold">Hapus</button>
            </td>
          </tr>
        `;
      });

      const tableEl = document.createElement('div');
      tableEl.className = "mb-6";
      tableEl.innerHTML = `
        <table class="w-full text-xs text-left border-collapse border border-gray-400">
          <thead class="bg-yellow-header font-bold text-center border-b border-gray-400">

    // ==========================================
    // FUNGSI CRUD & INPUT
    // ==========================================
    function toggleJenisNominal() {
      // Pembantu saat input
    }

    function handleSimpan(e) {
      e.preventDefault();
      const idEdit = parseInt(document.getElementById('editId').value);
      const jenis = document.getElementById('inpJenis').value;
      const nominal = Number(document.getElementById('inpNominal').value) || 0;

      const objBaru = {
        id: idEdit === -1 ? Date.now() : idEdit,
        hari: document.getElementById('inpHari').value.trim(),
        tgl: document.getElementById('inpTgl').value.trim(),
        ket: document.getElementById('inpKet').value.trim(),
        pic: document.getElementById('inpPic').value,
        masuk: jenis === 'MASUK' ? nominal : 0,
        keluar: jenis === 'KELUAR' ? nominal : 0
      };

      if (idEdit === -1) {
        transaksiList.push(objBaru);
      } else {
        const idx = transaksiList.findIndex(t => t.id === idEdit);
        if (idx !== -1) transaksiList[idx] = objBaru;
      }

      simpanKeStorage();
      batalEdit();
      renderLaporan();
    }

    function editData(id) {
      const item = transaksiList.find(t => t.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('formTitle').textContent = "✏️ Edit Transaksi Kas";
      document.getElementById('inpHari').value = item.hari || '';
      document.getElementById('inpTgl').value = item.tgl || '';
      document.getElementById('inpKet').value = item.ket || '';
      document.getElementById('inpPic').value = item.pic || 'P.WITO';

      if (item.masuk > 0) {
        document.getElementById('inpJenis').value = 'MASUK';
        document.getElementById('inpNominal').value = item.masuk;
      } else {
        document.getElementById('inpJenis').value = 'KELUAR';
        document.getElementById('inpNominal').value = item.keluar;
      }

      document.getElementById('btnSubmit').textContent = "💾 Perbarui Transaksi";
      document.getElementById('btnBatal').classList.remove('hidden');

      // Scroll ke form input
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function batalEdit() {
      document.getElementById('editId').value = "-1";
      document.getElementById('formTitle').textContent = "📥 Menu Input Transaksi Kas";
      document.getElementById('formTransaksi').reset();
      document.getElementById('btnSubmit').textContent = "💾 Simpan Transaksi";
      document.getElementById('btnBatal').classList.add('hidden');
    }

    function hapusData(id) {
      const item = transaksiList.find(t => t.id === id);
      if (!item) return;

      if (confirm(`Hapus transaksi "${item.ket}"?`)) {
        transaksiList = transaksiList.filter(t => t.id !== id);
        simpanKeStorage();
        renderLaporan();
      }
    }

    function resetDataLampiran() {
      if (confirm("Muat ulang seluruh data sesuai contoh lampiran gambar? (Data perubahan saat ini akan diganti)")) {
        transaksiList = JSON.parse(JSON.stringify(dataAwal));
        simpanKeStorage();
        batalEdit();
        renderLaporan();
      }
    }

    // Inisialisasi awal
    window.onload = renderLaporan;
  </script>
